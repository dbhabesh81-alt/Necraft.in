<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'"><title>NE Craft</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Marcellus&display=swap"><style>:root{color-scheme:light}html,body{margin:0}img{max-width:100%}</style><style id="appcss">
/* Layout concept: a fixed WebGL stage sits behind scrolling "chapters". Each chapter has a slot where a handmade object
   (lamps, chair, planters, cloth) follows the scroll and turns. Shop and account pages stay calm and typographic. */
:root{
  --bg:#F6EBD6; --bg2:#EEDFC1; --surface:#FFF8E9; --ink:#1D2B20; --muted:#5B6858; --line:rgba(35,80,43,.18);
  --green:#23502B; --maroon:#7D1F10; --cane:#C98B3A;
  --btn-bg:#23502B; --btn-fg:#FFF8E9; --good:#2E7D32; --warn:#A8620A; --bad:#B3261E;
  --shadow:0 20px 44px -26px rgba(70,45,10,.55);
  --f-display:'Marcellus','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A12; --bg2:#14261A; --surface:#183021; --ink:#F2E8D2; --muted:#A8B6A3; --line:rgba(242,232,210,.15);
    --green:#8CCB96; --maroon:#E58A72; --cane:#E3A65A; --btn-bg:#E3A65A; --btn-fg:#25170A;
    --good:#7FCB86; --warn:#E3B04F; --bad:#F08A80; --shadow:0 20px 44px -26px rgba(0,0,0,.75); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A12; --bg2:#14261A; --surface:#183021; --ink:#F2E8D2; --muted:#A8B6A3; --line:rgba(242,232,210,.15);
  --green:#8CCB96; --maroon:#E58A72; --cane:#E3A65A; --btn-bg:#E3A65A; --btn-fg:#25170A;
  --good:#7FCB86; --warn:#E3B04F; --bad:#F08A80; --shadow:0 20px 44px -26px rgba(0,0,0,.75); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html{-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(2.5rem,6.4vw,4.9rem)}
h2{font-size:clamp(1.9rem,3.6vw,3rem)}
h3{font-size:1.3rem}
p{margin:0;max-width:62ch}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
:focus-visible{outline:2px solid var(--cane);outline-offset:3px;border-radius:6px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.eyebrow{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--maroon)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.price{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#stage{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
#app{flex:1;min-width:0}
body.admin-mode #stage{display:none}

/* header */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:16px;min-height:66px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--f-display);font-size:1.5rem;line-height:1;white-space:nowrap}
.logo svg{width:28px;height:28px;color:var(--green);flex:none}
.logo .ne{color:var(--green);-webkit-text-stroke:.7px currentColor}
.logo .cr{color:var(--maroon)}
.logo .in{font-size:.62em;color:var(--maroon);margin-left:-3px;align-self:flex-end;padding-bottom:2px}
.nav{display:flex;gap:4px;margin-left:24px}
.nav a{padding:8px 14px;border-radius:99px;text-decoration:none;font-weight:500;font-size:.95rem}
.nav a:hover,.nav a[aria-current="page"]{background:var(--bg2)}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.ibtn{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:transparent;text-decoration:none}
.ibtn:hover{background:var(--bg2)}
.ibtn svg{width:21px;height:21px}
.badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--maroon);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center}
:root[data-theme="dark"] .badge{color:#1a0d08}
.burger{display:none}
.mnav{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:99px;border:1.5px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);font-weight:600;text-decoration:none;font-size:.95rem;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:8px 16px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--maroon);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* hero + chapters */
.chap{padding-block:clamp(40px,8vw,96px)}
.chap-in{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,4vw,56px);align-items:center}
.chap.flip .chap-in .slot{order:-1}
.chap .copy{display:flex;flex-direction:column;gap:18px;align-items:flex-start;min-width:0}
.chap .copy h1,.chap .copy h2{max-width:14ch}
.slot{min-height:clamp(300px,42vw,520px);position:relative}
.slot.nogl{display:grid;place-items:center;border-radius:28px;background:radial-gradient(circle at 50% 40%,var(--bg2),transparent 70%)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:.8rem;font-weight:500;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.chip.on{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
button.chip{cursor:pointer}
.solid{background:var(--bg);position:relative}
.band{background:var(--bg2)}
.sec{padding-block:clamp(48px,7vw,88px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sec-head .copy{display:flex;flex-direction:column;gap:10px}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.pcard{position:relative;display:flex;flex-direction:column;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;text-decoration:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));will-change:transform}
.pcard:hover{box-shadow:var(--shadow)}
.pimg{aspect-ratio:1/1;background:radial-gradient(circle at 50% 38%,var(--bg2),transparent 78%);display:grid;place-items:center;overflow:hidden;max-width:100%}
.pimg img{width:100%;height:100%;object-fit:contain;transition:transform .5s}
.pimg img.photo{object-fit:cover}
.pcard:hover .pimg img{transform:scale(1.05)}
.pimg .ph{font-family:var(--f-display);font-size:2.4rem;color:var(--muted);opacity:.5}
.pinfo{padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.pcat{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pname{font-family:var(--f-display);font-size:1.18rem;line-height:1.2}
.pcard a,a.chip{text-decoration:none;color:inherit}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px}
.pr{font-weight:700;font-variant-numeric:tabular-nums}
.pr s{font-weight:400;color:var(--muted);font-size:.85em;margin-left:6px}
.off{font-size:.75rem;font-weight:700;color:var(--maroon);margin-left:6px}
.tag{position:absolute;top:12px;left:12px;z-index:2;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.stars{display:inline-flex;gap:1px;color:var(--cane);font-size:.95rem;letter-spacing:1px;white-space:nowrap}
.stars .off-s{opacity:.3}
.addq{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--btn-bg);background:transparent;display:grid;place-items:center;flex:none}
.addq:hover{background:var(--btn-bg);color:var(--btn-fg)}
.addq svg{width:18px;height:18px}

/* banner */
.frame{perspective:1200px}
.frame-in{border-radius:26px;overflow:hidden;box-shadow:var(--shadow);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out;border:1px solid var(--line)}
.frame-in img{width:100%;height:auto}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.trio>div{display:flex;flex-direction:column;gap:8px;padding-top:18px;border-top:2px solid var(--green)}
.trio h3{font-size:1.2rem}

/* page chrome */
.page{padding-block:clamp(28px,5vw,56px) clamp(56px,8vw,96px);background:var(--bg);min-height:60vh}
.page-head{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.crumbs{font-size:.85rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.toolbar .grow{flex:1;min-width:0}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.8rem;font-weight:600;letter-spacing:.04em}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
textarea{min-height:96px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form{display:flex;flex-direction:column;gap:16px}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.hint{font-size:.82rem;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-size:.92rem}

/* cards/panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,28px)}
.panel + .panel{margin-top:18px}
.two>.panel+.panel,.adm-grid>.panel+.panel,.adm-grid>.panel{margin-top:0}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.sticky{position:sticky;top:90px}
.kv{display:flex;justify-content:space-between;gap:12px;padding-block:6px}
.kv.total{font-weight:700;font-size:1.1rem;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}

/* product page */
.pd{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
.viewer{position:relative;aspect-ratio:1/1;border-radius:26px;background:radial-gradient(circle at 50% 38%,var(--bg2),var(--surface) 85%);border:1px solid var(--line);overflow:hidden;touch-action:pan-y;cursor:grab;max-width:100%}
.viewer canvas{width:100%;height:100%;display:block}
.viewer img{width:100%;height:100%;object-fit:cover}
.viewer .vh{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:.78rem;color:var(--muted);pointer-events:none}
.pd-info{display:flex;flex-direction:column;gap:16px;min-width:0}
.pd-info h1{font-size:clamp(2rem,4vw,3rem)}
.pd-price{font-size:1.7rem;font-weight:700;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pd-price s{font-size:1rem;font-weight:400;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:99px}
.qty button{width:38px;height:38px;border:0;background:none;font-size:1.2rem;border-radius:50%}
.qty button:hover{background:var(--bg2)}
.qty span{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.specs{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:.92rem;margin:0}
.specs dt{color:var(--muted)}.specs dd{margin:0}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stock-low{color:var(--warn);font-weight:600;font-size:.88rem}
.stock-out{color:var(--bad);font-weight:600;font-size:.88rem}
.review{padding-block:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.starpick{display:inline-flex;gap:4px}
.starpick button{background:none;border:0;font-size:1.6rem;line-height:1;color:var(--cane);padding:0}
.starpick button.off-s{opacity:.28}

/* cart */
.line{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;padding-block:16px;border-top:1px solid var(--line);align-items:center}
.line:first-child{border-top:0}
.line .t{width:96px;height:96px;border-radius:14px;background:var(--bg2);overflow:hidden}
.line .t img{width:100%;height:100%;object-fit:contain}
.line .t img.photo{object-fit:cover}
.line .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.line .rt{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.empty{text-align:center;padding:clamp(32px,6vw,64px) 16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{margin-inline:auto}

/* checkout */
.opt{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--green);background:color-mix(in srgb,var(--green) 8%,var(--surface))}
.opt input{margin-top:5px}
.opt .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
.opts{display:flex;flex-direction:column;gap:10px}
.addr{display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.suffixes{display:flex;gap:6px;flex-wrap:wrap}
.secure{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--muted)}

/* orders */
.ostat{display:inline-flex;padding:4px 12px;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid currentColor}
.ostat.s-Delivered{color:var(--good)}
.ostat.s-Cancelled{color:var(--bad)}
.ostat.s-Placed,.ostat.s-Confirmed{color:var(--warn)}
.ostat.s-Packed,.ostat.s-Shipped,.ostat.s-Out\ for\ delivery{color:var(--green)}
.ocard{display:flex;flex-direction:column;gap:12px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:var(--surface);text-decoration:none}
.ocard:hover{box-shadow:var(--shadow)}
.ocard+.ocard{margin-top:14px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs span{width:46px;height:46px;border-radius:10px;background:var(--bg2);overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:contain}
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:8px 0 4px;list-style:none;padding:0}
.track li{position:relative;text-align:center;font-size:.78rem;padding-top:34px;color:var(--muted);min-width:0}
.track li::before{content:"";position:absolute;top:8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--bg2);border:2px solid var(--line);z-index:1}
.track li::after{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line)}
.track li:first-child::after{display:none}
.track li.done{color:var(--ink)}
.track li.done::before{background:var(--green);border-color:var(--green)}
.track li.done::after{background:var(--green)}
.track li.now::before{box-shadow:0 0 0 5px color-mix(in srgb,var(--green) 25%,transparent)}
.track b{display:block;font-weight:600}
.acc{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
.sidenav{display:flex;flex-direction:column;gap:4px}
.sidenav a,.sidenav button{padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:500;text-align:left;background:none;border:0}
.sidenav a:hover,.sidenav a[aria-current="page"],.sidenav button:hover{background:var(--bg2)}
.addr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.addr-card{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:10px}

/* modal + toast */
.scrim{position:fixed;inset:0;z-index:200;background:rgba(10,18,12,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;overflow-y:auto}
.dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:22px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow);animation:pop .25s ease-out}
.dialog.wide{width:min(820px,100%)}
.dialog-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:300;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:600;font-size:.92rem;transition:.3s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.on{transform:translate(-50%,0);opacity:1}

/* prose */
.prose{display:flex;flex-direction:column;gap:14px;max-width:70ch}
.prose h2{font-size:1.6rem;margin-top:18px}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.copyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.copyrow code{font-family:var(--f-body);font-weight:600;padding:8px 14px;border-radius:10px;background:var(--bg2);user-select:all;overflow-wrap:anywhere}

/* footer */
#ftr{background:var(--bg2);border-top:1px solid var(--line);padding-block:48px 28px;position:relative}
.ft{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:32px}
.ft h4{font-family:var(--f-body);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;color:var(--muted)}
.ft ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ft a{text-decoration:none}.ft a:hover{text-decoration:underline}
.ft-bot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
body.admin-mode #ftr,body.admin-mode #hdr{display:none}

/* admin */
.adm{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.adm-side{background:var(--bg2);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;align-self:start}
.adm-side .logo{margin:0 8px 18px}
.adm-side a,.adm-side button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:500;background:none;border:0;text-align:left}
.adm-side a svg,.adm-side button svg{width:18px;height:18px;flex:none}
.adm-side a:hover,.adm-side a[aria-current="page"],.adm-side button:hover{background:var(--surface)}
.adm-side .sp{flex:1}
.adm-main{padding:clamp(18px,3vw,36px);min-width:0;display:flex;flex-direction:column;gap:24px}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap td{white-space:nowrap}
.nogl-img{width:100%;height:100%;object-fit:cover;border-radius:26px;box-shadow:var(--shadow);border:1px solid var(--line);aspect-ratio:16/10}
.tthumb{width:44px;height:44px;border-radius:10px;background:var(--bg2);overflow:hidden}
.tthumb img{width:100%;height:100%;object-fit:contain}
.tthumb img.photo{object-fit:cover}
.sample{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px dashed var(--muted);color:var(--muted);margin-left:6px;vertical-align:middle}
select.inline{width:auto;padding:7px 28px 7px 10px;font-size:.85rem;border-radius:10px}
.switch{position:relative;display:inline-block;width:42px;height:24px}
.switch input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);transition:.2s}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i::after{transform:translateX(18px)}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .bar{width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:var(--green);min-height:3px;opacity:.85}
.chart .col:last-child .bar{opacity:1;background:var(--maroon)}
.chart small{font-size:.72rem;color:var(--muted)}
.chart .v{font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
.adm-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.admin-login{max-width:420px;margin:12vh auto;padding-inline:16px}
.m-adm{display:none}

@media (max-width:980px){
  .chap-in{grid-template-columns:1fr}
  .chap.flip .chap-in .slot{order:0}
  .slot{min-height:clamp(260px,62vw,380px);order:-1}
  .chap.flip .chap-in .slot{order:-1}
  .two,.pd,.acc{grid-template-columns:1fr}
  .sticky{position:static}
  .ft{grid-template-columns:1fr 1fr}
  .trio{grid-template-columns:1fr}
  .adm{grid-template-columns:1fr}
  .adm-side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .adm-side .logo{width:100%;margin-bottom:6px}
  .adm-side .sp{display:none}
  .adm-grid{grid-template-columns:1fr}
  .sidenav{flex-direction:row;flex-wrap:wrap}
}
@media (max-width:760px){
  .nav{display:none}
  .burger{display:grid}
  .mnav{display:none;flex-direction:column;gap:4px;padding-block:8px 16px;border-top:1px solid var(--line)}
  .mnav.open{display:flex}
  .mnav a{padding:12px 6px;text-decoration:none;font-weight:500;border-bottom:1px solid var(--line)}
  .row2,.row3{grid-template-columns:1fr}
  .line{grid-template-columns:72px minmax(0,1fr)}
  .line .t{width:72px;height:72px}
  .line .rt{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .pinfo{padding:10px 12px 14px}
  .pname{font-size:1.02rem}
  .prow{flex-wrap:wrap}
  .track{grid-template-columns:repeat(3,1fr);row-gap:10px}
  .track li:nth-child(4)::after{display:none}
  .ft{grid-template-columns:1fr}
  .logo{font-size:1.3rem}
}
.mob-act{display:none}
@media (max-width:760px){
  .mob-act{display:flex;gap:10px;align-items:center;margin-top:8px}
  .col-act,.col-cat{display:none}
}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .pcard{transform:none!important}
}
[data-rv]{opacity:.3;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
[data-rv].in{opacity:1;transform:none}
.route-in{animation:routein .45s cubic-bezier(.2,.8,.2,1)}
@keyframes routein{from{opacity:.2;transform:translateY(14px)}to{opacity:1;transform:none}}

  return stored === hash(pw);
}

function cartLines() {
  return S.cart.map(c => { const p = pById(c.pid); return p ? { p, qty: c.qty } : null; }).filter(Boolean);
}
function cartCount() { return S.cart.reduce((a, c) => a + c.qty, 0); }
function cartTotals(method) {
  const sub = cartLines().reduce((a, l) => a + l.p.price * l.qty, 0);
  const ship = sub === 0 || sub >= CFG.FREE_SHIP_ABOVE ? 0 : CFG.SHIP_FEE;
  const cod = method === 'COD' ? CFG.COD_FEE : 0;
  return { sub, ship, cod, total: sub + ship + cod };
}
function addToCart(pid, qty) {
  const p = pById(pid); if (!p) return;
  if (p.stock <= 0) return toast('Out of stock');
  const c = S.cart.find(x => x.pid === pid);
  const want = (c ? c.qty : 0) + (qty || 1);
  if (want > p.stock) { toast('Only ' + p.stock + ' in stock'); if (c) c.qty = p.stock; else S.cart.push({ pid, qty: p.stock }); }
  else if (c) c.qty = want; else S.cart.push({ pid, qty: qty || 1 });
  save('cart'); renderHeader(); if (want <= p.stock) toast('Added to cart');
}
function setQty(pid, q) {
  const p = pById(pid), c = S.cart.find(x => x.pid === pid); if (!c || !p) return;
  if (q <= 0) S.cart = S.cart.filter(x => x.pid !== pid);
  else c.qty = Math.min(q, p.stock);
  save('cart'); renderHeader();
}
async function signup(name, email, phone, pw) {
  email = email.trim().toLowerCase();
  if (S.users.some(u => u.email === email)) return 'An account with this email already exists. Sign in instead.';
  const u = { id: rid('u'), name: name.trim(), email, phone: phone.trim(), pw: await pwHash(pw), addresses: [], createdAt: Date.now() };
  S.users.push(u); save('users'); S.uid = u.id; LS.set('session', S.uid); return '';
}
async function signin(email, pw) {
  const k = 'user:' + email.trim().toLowerCase(), w = lockLeft(k);
  if (w) return 'Too many tries. Wait ' + w + ' seconds and try again.';
  const u = S.users.find(x => x.email === email.trim().toLowerCase());
  if (!u || !(await pwCheck(u.pw, pw))) { loginFail(k); return 'Email or password is incorrect.'; }
  if (u.pw.indexOf('p1$') !== 0) { u.pw = await pwHash(pw); save('users'); }

function curToken() { let h = ''; try { h = (location.hash || '').slice(1); } catch (e) { } return h || FALLBACK_HASH || 'home'; }
function parseToken(tok) {
  const m = tok.match(/^([a-z]+)(?:-(.+))?$/i);
  return { name: (m ? m[1] : 'home').toLowerCase(), arg: m && m[2] ? m[2] : '' };
}

function route() {
  const r = parseToken(curToken());
  const isAdmin = r.name === 'admin';
  document.body.classList.toggle('admin-mode', isAdmin);
  closeModal();

  const prev = CURRENT; CURRENT = r;

  if (prev.name !== r.name || prev.arg !== r.arg) scrollTop();
  after(r);

}
function after(r) {
  observeReveals();
  if (r.name === 'home') {
    if (STAGE.on) stageResize();
    else $$('[data-slot]').forEach(s => { if (s.dataset.slot === 'hero') s.innerHTML = '<img class="nogl-img" src="' + CFG.BANNER + '" alt="NECRAFT.in by Purbanchal Hasta Udyog">'; else s.style.display = 'none'; });

  if (r.name === 'product') { const el = $('#viewer'); if (el && el.dataset.pid) { const p = pById(el.dataset.pid); if (p && !p.img) viewerStart(el, p); } }
  $$('img[data-th]').forEach(im => { const k = im.dataset.th; if (TH.cache[k]) im.src = TH.cache[k]; else { const p = S.products.find(x => x.model === k); if (p) thumbFor(p); } });
}
let IO = null;
function observeReveals() {
  if (!('IntersectionObserver' in window)) { $$('[data-rv]').forEach(e => e.classList.add('in')); return; }
  if (!IO) IO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); IO.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: .05 });
  $$('[data-rv]:not(.in)').forEach(e => IO.observe(e));
}

  const d = new Date(), id = 'NEC-' + String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  const t = cartTotals(method), now = Date.now();

    items: ls.map(l => ({ pid: l.p.id, name: l.p.name, price: l.p.price, qty: l.qty, model: l.p.model, img: !!l.p.img })),

  go('success-' + id);
};

function loadPhoto(file) {
  const msg = $('#f-photomsg'); if (!file) return;
  if (!/^image\//.test(file.type)) { if (msg) msg.textContent = 'That file is not an image. Choose a JPG or PNG photo.'; return; }
  const fr = new FileReader();
  fr.onerror = () => { if (msg) msg.textContent = 'Could not read that file. Try another photo.'; };
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      PF.img = c.toDataURL('image/jpeg', .82);
      const pv = $('#f-prev'); if (pv) pv.innerHTML = '<img class="photo" src="' + PF.img + '" alt="">';
      if (msg) msg.textContent = 'Photo ready (' + Math.round(PF.img.length * .75 / 1024) + ' KB). Press Save product to keep it.';
    };
    im.onerror = () => { if (msg) msg.textContent = 'That image could not be opened. Try a JPG or PNG.'; };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
